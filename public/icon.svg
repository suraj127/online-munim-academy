<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Outer Circle (Orange) -->
  <circle cx="50" cy="50" r="43" stroke="#FF7A00" stroke-width="4.5" fill="none" />
  <circle cx="50" cy="50" r="39" stroke="#FF7A00" stroke-width="2" fill="none" opacity="0.8" />
  <!-- Robot Body (Dark Blue) -->
  <path d="M 28 55 C 33 49, 67 49, 72 55 C 76 65, 24 65, 28 55 Z" fill="#0D2A4A" stroke="#FF7A00" stroke-width="1.5" />
  <!-- Robot Face Capsule (Cream fill + orange border) -->
  <rect x="28" y="31" width="44" height="23" rx="10" stroke="#FF7A00" stroke-width="4.5" fill="#FFFBEB" />
  <!-- Robot Antenna -->
  <line x1="50" y1="31" x2="50" y2="24" stroke="#FF7A00" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="50" cy="22" r="4" fill="#FF7A00" />
  <!-- Left Eye (Blue Caret) -->
  <path d="M 37 46 L 42 41 L 47 46" stroke="#0F172A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Eye (Green Caret) -->
  <path d="M 53 46 L 58 41 L 63 46" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
